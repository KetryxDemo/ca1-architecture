schema: architecture.allocation.reverse.v1
file: model/allocation/control-to-function.yaml

about: >-
  Reverse allocation index. One entry per design control id referenced by this model, giving the
  system function it is allocated to and the realization that function is built from. This file
  intentionally holds no design control content - no requirement text, no risk statement, no test
  steps. Those live in Ketryx and are the system of record. This file exists so that an agent
  holding a control id can reach the architecture in one hop, and an agent holding a changed
  source path can reach the control ids in one hop through
  model/allocation/function-to-control.yaml.

systemOfRecord:
  controls: Ketryx
  allocation: this repository
  codeRealization: ../code-repo/

controlItemTypes:
  - prefix: RQ
    ketryxItemType: REQUIREMENT
    role: requirement
  - prefix: RSK
    ketryxItemType: RISK
    role: risk
  - prefix: RC
    ketryxItemType: REQUIREMENT
    role: risk control
    roleExpressedBy: >-
      The built-in IS_RISK_CONTROLLED_BY relation, with the risk as source and the requirement as
      target. RISK_CONTROL is not an item type. RC- is a naming convention in this model for the
      requirements that carry the risk control role, and those ids resolve to REQUIREMENT items.
  - prefix: TC
    ketryxItemType: TEST_PROTOCOL
    role: verification spec / test case

idRanges:
  - prefix: RQ
    range: RQ-HM-01 to RQ-HM-09
  - prefix: RSK
    range: RSK-HM-01 to RSK-HM-05
  - prefix: RC
    range: RC-HM-01 to RC-HM-04
  - prefix: TC
    range: TC-HM-01 to TC-HM-09

