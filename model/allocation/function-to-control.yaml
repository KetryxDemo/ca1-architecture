schema: architecture.allocation.forward.v1
file: model/allocation/function-to-control.yaml

about: >-
  Forward allocation index. For each system function, the design control ids allocated to it, and
  the source modules it is realized from. Design control content - requirement text, risk
  statements, test steps - is not held here. It lives in Ketryx. This file holds the allocation
  only, so that an agent can go from a function or a source path to the set of ids it must consult.

controlItemTypes:
  - prefix: RQ
    ketryxItemType: REQUIREMENT
    layer: LYR-REQ
    role: requirement
  - prefix: RSK
    ketryxItemType: RISK
    layer: LYR-SAFETY
    role: risk
  - prefix: RC
    ketryxItemType: REQUIREMENT
    layer: LYR-REQ
    role: risk control
    roleExpressedBy: >-
      The built-in IS_RISK_CONTROLLED_BY relation, with the risk as source and the requirement as
      target. There is no separate risk control item type; RC- is a naming convention in this
      model for the requirements that carry that role.
  - prefix: TC
    ketryxItemType: TEST_PROTOCOL
    layer: LYR-VV
    role: verification spec / test case

allocations:
  - function: FN-HM-RAM
    functionFile: model/functions/FN-HM-RAM.yaml
    owningProcess: PRC-HEALTHMON
    primaryModule:
      module: MOD-MEMINTEGRITY
      path: src/health_monitor/checks/memory_integrity.py
      exclusiveToThisFunction: true
    sharedModules:
      - module: MOD-CHECKBASE
        path: src/health_monitor/checks/base.py
        note: PeriodicCheck base class of all three checks
      - module: MOD-INTERVALTIMER
        path: src/health_monitor/common/interval_timer.py
        note: timer constructed and polled by all three checks
      - module: MOD-BUS
        path: src/health_monitor/bus.py
        note: transport for every published result
      - module: MOD-TYPES
        path: src/health_monitor/common/types.py
        note: CheckResult, CheckStats and HealthState used by all three checks
      - module: MOD-CONFIG
        path: src/health_monitor/config.py
        note: one loader, one file, disjoint sections per check
      - module: MOD-SERVICE
        path: src/health_monitor/service.py
        note: constructs and services all three checks
      - module: MOD-LOGSETUP
        path: src/health_monitor/logging_setup.py
        note: log record formatting for all three checks
    requirements: [RQ-HM-01, RQ-HM-02, RQ-HM-03]
    risks: [RSK-HM-01, RSK-HM-02]
    riskControlRequirements: [RC-HM-01]
    verifications: [TC-HM-01, TC-HM-02, TC-HM-03]

