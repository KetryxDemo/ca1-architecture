moduleToControlIndex:
  about: >-
    From a changed source path to the design control ids that path can reach. `controls` is the
    union over every function the module is realized into. For a module marked
    sharedAcrossFunctions, the union is the widest possible answer and is a starting point, not a
    result. Narrow it with `narrowWith` before treating the whole union as in scope.
  entries:
    - module: MOD-MEMINTEGRITY
      path: src/health_monitor/checks/memory_integrity.py
      functions: [FN-HM-RAM]
      controls: [RQ-HM-01, RQ-HM-02, RQ-HM-03, RSK-HM-01, RSK-HM-02, RC-HM-01, TC-HM-01, TC-HM-02, TC-HM-03]
      sharedAcrossFunctions: false
    - module: MOD-STORAGEHEALTH
      path: src/health_monitor/checks/storage_health.py
      functions: [FN-HM-DISK]
      controls: [RQ-HM-04, RQ-HM-05, RQ-HM-06, RSK-HM-03, RC-HM-02, TC-HM-04, TC-HM-05, TC-HM-06]
      sharedAcrossFunctions: false
    - module: MOD-HEARTBEAT
      path: src/health_monitor/checks/heartbeat.py
      functions: [FN-HM-HB]
      controls: [RQ-HM-07, RQ-HM-08, RQ-HM-09, RSK-HM-04, RSK-HM-05, RC-HM-03, RC-HM-04, TC-HM-07, TC-HM-08, TC-HM-09]
      sharedAcrossFunctions: false
    - module: MOD-CHECKBASE
      path: src/health_monitor/checks/base.py
      functions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
      controls: [RQ-HM-01, RQ-HM-02, RQ-HM-03, RSK-HM-01, RSK-HM-02, RC-HM-01, TC-HM-01, TC-HM-02, TC-HM-03, RQ-HM-04, RQ-HM-05, RQ-HM-06, RSK-HM-03, RC-HM-02, TC-HM-04, TC-HM-05, TC-HM-06, RQ-HM-07, RQ-HM-08, RQ-HM-09, RSK-HM-04, RSK-HM-05, RC-HM-03, RC-HM-04, TC-HM-07, TC-HM-08, TC-HM-09]
      sharedAcrossFunctions: true
      narrowWith:
        - model/modules/module-index.yaml, the apiGroups block on this module - which group the changed members belong to
        - the callSites, sectionsByFunction or usedByFunctions block on this module, for which functions reach that group
    - module: MOD-INTERVALTIMER
      path: src/health_monitor/common/interval_timer.py
      functions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
      controls: [RQ-HM-01, RQ-HM-02, RQ-HM-03, RSK-HM-01, RSK-HM-02, RC-HM-01, TC-HM-01, TC-HM-02, TC-HM-03, RQ-HM-04, RQ-HM-05, RQ-HM-06, RSK-HM-03, RC-HM-02, TC-HM-04, TC-HM-05, TC-HM-06, RQ-HM-07, RQ-HM-08, RQ-HM-09, RSK-HM-04, RSK-HM-05, RC-HM-03, RC-HM-04, TC-HM-07, TC-HM-08, TC-HM-09]
      sharedAcrossFunctions: true
      narrowWith:
        - model/modules/module-index.yaml MOD-INTERVALTIMER apiGroups - which group the changed members belong to, and the condition under which that group is live
        - model/modules/module-index.yaml MOD-INTERVALTIMER constructionSites - the arguments each function passes at each construction site
        - model/modules/module-index.yaml MOD-INTERVALTIMER memberReadSites - the members each function reads, per instance
        - model/analysis/n2-matrix.yaml N2-HEALTHMON - the same facts arranged per function pair
    - module: MOD-BUS
      path: src/health_monitor/bus.py
      functions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
      controls: [RQ-HM-01, RQ-HM-02, RQ-HM-03, RSK-HM-01, RSK-HM-02, RC-HM-01, TC-HM-01, TC-HM-02, TC-HM-03, RQ-HM-04, RQ-HM-05, RQ-HM-06, RSK-HM-03, RC-HM-02, TC-HM-04, TC-HM-05, TC-HM-06, RQ-HM-07, RQ-HM-08, RQ-HM-09, RSK-HM-04, RSK-HM-05, RC-HM-03, RC-HM-04, TC-HM-07, TC-HM-08, TC-HM-09]
      sharedAcrossFunctions: true
      narrowWith:
        - model/modules/module-index.yaml, the apiGroups block on this module - which group the changed members belong to
        - the callSites, sectionsByFunction or usedByFunctions block on this module, for which functions reach that group
    - module: MOD-TYPES
      path: src/health_monitor/common/types.py
      functions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
      controls: [RQ-HM-01, RQ-HM-02, RQ-HM-03, RSK-HM-01, RSK-HM-02, RC-HM-01, TC-HM-01, TC-HM-02, TC-HM-03, RQ-HM-04, RQ-HM-05, RQ-HM-06, RSK-HM-03, RC-HM-02, TC-HM-04, TC-HM-05, TC-HM-06, RQ-HM-07, RQ-HM-08, RQ-HM-09, RSK-HM-04, RSK-HM-05, RC-HM-03, RC-HM-04, TC-HM-07, TC-HM-08, TC-HM-09]
      sharedAcrossFunctions: true
      narrowWith:
        - model/modules/module-index.yaml, the apiGroups block on this module - which group the changed members belong to
        - the callSites, sectionsByFunction or usedByFunctions block on this module, for which functions reach that group
    - module: MOD-CONFIG
      path: src/health_monitor/config.py
      functions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
