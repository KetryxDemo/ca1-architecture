    - module: MOD-SERVICE
      path: src/health_monitor/service.py
      functions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
      controls: [RQ-HM-01, RQ-HM-02, RQ-HM-03, RSK-HM-01, RSK-HM-02, RC-HM-01, TC-HM-01, TC-HM-02, TC-HM-03, RQ-HM-04, RQ-HM-05, RQ-HM-06, RSK-HM-03, RC-HM-02, TC-HM-04, TC-HM-05, TC-HM-06, RQ-HM-07, RQ-HM-08, RQ-HM-09, RSK-HM-04, RSK-HM-05, RC-HM-03, RC-HM-04, TC-HM-07, TC-HM-08, TC-HM-09]
      sharedAcrossFunctions: true
      narrowWith:
        - model/modules/module-index.yaml, the apiGroups block on this module - which group the changed members belong to
        - the callSites, sectionsByFunction or usedByFunctions block on this module, for which functions reach that group
    - module: MOD-LOGSETUP
      path: src/health_monitor/logging_setup.py
      functions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
      controls: [RQ-HM-01, RQ-HM-02, RQ-HM-03, RSK-HM-01, RSK-HM-02, RC-HM-01, TC-HM-01, TC-HM-02, TC-HM-03, RQ-HM-04, RQ-HM-05, RQ-HM-06, RSK-HM-03, RC-HM-02, TC-HM-04, TC-HM-05, TC-HM-06, RQ-HM-07, RQ-HM-08, RQ-HM-09, RSK-HM-04, RSK-HM-05, RC-HM-03, RC-HM-04, TC-HM-07, TC-HM-08, TC-HM-09]
      sharedAcrossFunctions: true
      narrowWith:
        - model/modules/module-index.yaml, the apiGroups block on this module - which group the changed members belong to
        - the callSites, sectionsByFunction or usedByFunctions block on this module, for which functions reach that group

resolutionProcedure:
  about: >-
    The steps to take from a change to the set of control ids in scope. The model supplies facts
    at each step; the conclusion is not recorded anywhere in the model.
  steps:
    - step: 1
      action: Identify what changed - a source path, a set of module members, a topic, or a configuration key.
    - step: 2
      action: >-
        Look the path up in moduleToControlIndex above. If sharedAcrossFunctions is false, the
        listed controls are the answer.
    - step: 3
      action: >-
        If sharedAcrossFunctions is true, follow narrowWith. Determine which API group the changed
        members belong to and read that group's activation condition.
    - step: 4
      action: >-
        For each function, compare the activation condition against that function's recorded
        construction arguments and the members it reads. Both are recorded per function and per
        instance in model/modules/module-index.yaml and in the timerUsage block of each function file.
    - step: 5
      action: >-
        Check the thresholdsAndWindows recorded on each primary module. The key name says nothing
        about where a threshold is evaluated. Read the relationToIntervalTimer field on each
        entry - some are measured and evaluated inside the function on their own clock, and at
        least one is handed to the shared module as a constructor argument instead.
    - step: 6
      action: Carry the resulting function set back through the allocations above for the control ids.
    - step: 7
      action: >-
        For anything crossing a process boundary, use N2-PRC in model/analysis/n2-matrix.yaml and
        model/interfaces/topics.yaml, and respect the evidenceBoundary recorded on that matrix.
