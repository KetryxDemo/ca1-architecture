schema: architecture.n2matrix.v1
file: model/analysis/n2-matrix.yaml

about: >-
  N-squared interaction matrices. Two matrices are held here - one over the system functions owned
  by PRC-HEALTHMON, and one over the five software processes. A matrix records what couples one
  element to another and through which mechanism, as observed facts about each side. It does not
  record the consequence of any particular change, and it does not carry a precomputed verdict on
  which side a change to a shared module reaches. Resolving that is the reader's work, from the
  facts recorded here together with the activation conditions in model/modules/module-index.yaml.

couplingKinds:
  - id: CPL-SHAREDMODULE
    name: Shared source module
    definition: >-
      Both elements are realized in part by the same source module. A shared module entry records
      what each side does with the module - how many instances it constructs, with what arguments,
      which members it reads, which methods it calls - under rowUsage and columnUsage. Sharing a
      module is not the same as sharing the part of it that changed.
  - id: CPL-DATAFLOW
    name: Data flow
    definition: An output produced by the row element is an input consumed by the column element.
  - id: CPL-TOPIC
    name: Shared topic
    definition: Both elements publish to, or subscribe from, the same topic.
  - id: CPL-RESOURCE
    name: Shared runtime resource
    definition: >-
      Both elements share or contend for the same runtime resource - the control-loop thread, the
      process lifetime, a configuration file, a bus instance, a hardware device.

matrices:

  - id: N2-HEALTHMON
    name: N-squared matrix, health monitor system functions
    scope: The three system functions owned by PRC-HEALTHMON.
    axes:
      rows: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
      columns: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
    reading: >-
      Row is the element under change. Column is the element evaluated against it. Diagonal cells
      are omitted. Cells are directed, so the row-to-column cell and the column-to-row cell are
      both present with the usage facts swapped.
    cells:
      - id: N2-RAM-DISK
        row: FN-HM-RAM
        column: FN-HM-DISK
        sharedModules:
          - module: MOD-INTERVALTIMER
            path: src/health_monitor/common/interval_timer.py
            reachedIdentically: true
            reachedIdenticallyNote: >-
              Both functions import this module, construct at least one IntervalTimer inside their
              own constructor, and have an instance polled once per control-loop iteration through
              PeriodicCheck.service. An import graph, a call graph over poll, or a path search does
              not separate them.
            rowUsage:
              function: FN-HM-RAM
              instanceCount: 1
              instanceNames: [ram-sweep]
              constructorArgsByInstance:
                ram-sweep:
                  period_s: config.scan_period_s (memory.scan_period_s = 5.0)
                  expiry_s: not supplied
                  start_due: true
              tickMembersRead: [due, overdue_by, missed_slots, now]
              timerMethodsCalled: [poll, mark_serviced]
              thresholdsAndWindowsHeldBySide:
                - slice_budget_ms = 1.5, measured on budget_clock (time.perf_counter), evaluated in MemoryIntegrityCheck._advance_slice
            columnUsage:
              function: FN-HM-DISK
              instanceCount: 1
              instanceNames: [disk-scan]
              constructorArgsByInstance:
                disk-scan:
                  period_s: config.scan_period_s (storage.scan_period_s = 30.0)
                  expiry_s: not supplied
                  start_due: true
              tickMembersRead: [due, now]
              timerMethodsCalled: [poll, mark_serviced]
              thresholdsAndWindowsHeldBySide:
                - stall_threshold_s = 120.0, measured on StorageHealthCheck._stale_for over the per mount _last_good_probe map, evaluated in StorageHealthCheck._evaluate
                - probe_latency_warn_ms = 40.0 and probe_latency_fault_ms = 250.0, measured on FilesystemProbe latency_clock (time.perf_counter)
            resolveWith:
              - file: model/modules/module-index.yaml
                key: MOD-INTERVALTIMER apiGroups
                gives: the members of each group and the condition under which each group is live
              - file: model/modules/module-index.yaml
                key: MOD-INTERVALTIMER constructionSites
                gives: the arguments passed at every site, per function and per instance
              - file: model/modules/module-index.yaml
                key: MOD-INTERVALTIMER memberReadSites
                gives: the TimerTick members each function reads, per instance
            resolutionNote: >-
              This cell records what each side does with the module. It does not record which group
              a given change reaches. That follows from the activation condition of the group
              changed, the constructor arguments at each site, and the members each side reads.
          - module: MOD-CHECKBASE
            path: src/health_monitor/checks/base.py
            reachedIdentically: true
            relationship: both functions are subclasses of PeriodicCheck
            rowUsage:
              function: FN-HM-RAM
              groups: [BHV-CHECK-SERVICE, BHV-CHECK-PUBLISH]
              tickHandling: receives the whole TimerTick from service, uninterpreted
            columnUsage:
              function: FN-HM-DISK
              groups: [BHV-CHECK-SERVICE, BHV-CHECK-PUBLISH]
              tickHandling: receives the whole TimerTick from service, uninterpreted
            note: >-
              The base class reads TimerTick.missed_slots and TimerTick.now and nothing else. It
              does not decide whether a check runs and does not acknowledge the cadence slot, so
              no distinction between the two sides exists at this layer.
          - module: MOD-BUS
            path: src/health_monitor/bus.py
            rowUsage:
              function: FN-HM-RAM
              groups: [BHV-BUS-PUB]
              via: publication through PeriodicCheck._publish only
            columnUsage:
              function: FN-HM-DISK
              groups: [BHV-BUS-PUB]
              via: publication through PeriodicCheck._publish only
          - module: MOD-TYPES
            path: src/health_monitor/common/types.py
            reachedIdentically: true
            note: Both sides build CheckResult values and are named on the bus by CheckResult.topic.
          - module: MOD-CONFIG
            path: src/health_monitor/config.py
            reachedIdentically: false
            rowSection: memory, MemoryCheckConfig
            columnSection: storage, StorageCheckConfig
            note: >-
              One file and one loader, disjoint sections. A change to the loader or the file schema
              reaches both sides; a change to one section's fields reaches the side that owns it.
          - module: MOD-SERVICE
            path: src/health_monitor/service.py
            reachedIdentically: true
            note: >-
              build_checks constructs both sides and step services both on every iteration in
              construction order. _sleep_budget takes the minimum of seconds_until_due across every
              check's timer, so each side's cadence influences how long the loop sleeps for both.
        sharedRuntimeResources:
          - the single control-loop thread of PRC-HEALTHMON
          - the PRC-HEALTHMON process lifetime
          - config/health-monitor.json
          - the MessageBus instance and its delivery queue
        dataFlow: []
        sharedTopics: []
        topicNamespaceNote: >-
          Both sides publish under the health. namespace through the same CheckResult.topic rule,
          on disjoint topic names.

