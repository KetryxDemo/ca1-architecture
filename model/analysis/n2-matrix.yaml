            columnSection: storage, StorageCheckConfig
            note: >-
              One file and one loader, disjoint sections. A change to the loader or the file schema
              reaches both sides; a change to one section's fields reaches the side that owns it.
          - module: MOD-SERVICE
            path: src/health_monitor/service.py
            reachedIdentically: true
            note: >-
              build_checks constructs both sides and step services both on every iteration in
              construction order. _sleep_budget takes the minimum of seconds_until_due across every
              check's timer, so each side's cadence influences how long the loop sleeps for both.
        sharedRuntimeResources:
          - the single control-loop thread of PRC-HEALTHMON
