              via: publication through PeriodicCheck._publish only
          - module: MOD-TYPES
            path: src/health_monitor/common/types.py
            reachedIdentically: true
            note: Both sides build CheckResult values and are named on the bus by CheckResult.topic.
          - module: MOD-CONFIG
            path: src/health_monitor/config.py
            reachedIdentically: false
