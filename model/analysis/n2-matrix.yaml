crossMatrixNotes:
  - id: N2-NOTE-HWSTORAGE
    subject: HWB-STORAGE
    fact: >-
      FN-HM-DISK probes the mount points listed in storage.mounts, which are /var/log and
      /var/lib/cases. PRC-CASERECORDER writes procedure records to the console store. The two are
      recorded as sharing HWB-STORAGE on IF-HM-CASEREC.
  - id: N2-NOTE-QUORUM
    subject: quorum
    fact: >-
      FN-HM-HB publishes a quorum result derived from the count of peer records whose live flag is
      set, across all four peers. Its subject set therefore spans every peer process at once,
      while FN-HM-RAM and FN-HM-DISK publish subjects drawn from console resources only.
  - id: N2-NOTE-LOOPBUDGET
    subject: control loop sleep
    fact: >-
      MOD-SERVICE _sleep_budget takes the minimum of seconds_until_due across every check's timer,
      capped at loop_period_s of 0.25 s. The configured cadences are 5.0 s for FN-HM-RAM, 30.0 s
      for FN-HM-DISK and 1.0 s for the FN-HM-HB emit timer.
