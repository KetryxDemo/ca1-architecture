        consumingFunctions: [FN-HM-HB]
        consumerEffect: >-
          An accepted message calls refresh on the timer instance FN-HM-HB holds for this peer. A
          message whose sequence is at or below the last recorded sequence for this peer is
          discarded and calls nothing.
        rosterEvidence: >-
          generator-control is entry in config/health-monitor.json under heartbeat.peers, so FN-HM-HB
          constructs a timer instance named peer-generator-control for it.
