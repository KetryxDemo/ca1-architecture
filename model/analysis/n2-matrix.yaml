  - id: N2-PRC
    name: N-squared matrix, software processes
    scope: The five software processes of the platform.
    axes:
      rows: [PRC-HEALTHMON, PRC-GENERATORCTL, PRC-MAPPINGENGINE, PRC-CATHETERIO, PRC-CASERECORDER]
      columns: [PRC-HEALTHMON, PRC-GENERATORCTL, PRC-MAPPINGENGINE, PRC-CATHETERIO, PRC-CASERECORDER]
    reading: >-
      Row is the process under change. Column is the process evaluated against it. Directed - a
      cell lists only what travels from the row process to the column process. Diagonal cells are
      omitted.
    evidenceBoundary: >-
      Only PRC-HEALTHMON is decomposed in this model and only its source is present in
      ../code-repo/. Cells with PRC-HEALTHMON on one axis are grounded in that source and in
      config/health-monitor.json. Peer to peer cells are not modelled, and an empty peer to peer
      cell means no evidence in this slice, not an absence of coupling.
    allPairSharedModules:
      - module: MOD-INTERVALTIMER
        path: src/health_monitor/common/interval_timer.py
        presentIn: PRC-HEALTHMON
        presentInPeers: unknown in this slice
      - module: MOD-BUS
        path: src/health_monitor/bus.py
        presentIn: PRC-HEALTHMON
        presentInPeers: >-
          The bus.py docstring records that the production platform runs a broker on a unix domain
          socket and that every service links against the same client library, so every process
          shares that client's contract. The client library itself is not in this repository.
    cells:
      - id: N2-PRC-HM-GENCTL
        row: PRC-HEALTHMON
        column: PRC-GENERATORCTL
