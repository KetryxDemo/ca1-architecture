schema: architecture.modules.v1
file: model/modules/module-index.yaml

about: >-
  Realization layer. Every source module in ../code-repo/ that realizes a modelled function, the
  API groups each module offers, and the recorded facts about how each function reaches them.
  `path` is the path as it appears in the code repository.

apiGroupModel:
  definition: >-
    An API group is a named, separately changeable part of a module's contract. It is a label over
    a set of members, not a separate class or a separate import. Two groups can live behind one
    class and one call, so the presence of a group in a module does not by itself say which
    callers it reaches.
  fields:
    - name: members
      meaning: The attributes, properties and methods that make up the group.
    - name: activation
      meaning: >-
        The condition under which the members carry meaning at run time. A member that is always
        reachable is not necessarily always live.
    - name: constructorGate
      meaning: >-
        The constructor argument, if any, that decides whether this group is live on an instance.
        `none` means the group is live on every instance of the module.
    - name: stateOwned
      meaning: The instance state this group reads or writes, and what each value is measured from.
    - name: changeSurface
      meaning: >-
        The extent of the contract this group owns. It bounds what a change to the group can
        affect. It is not a list of anticipated edits and carries no expectation about which
        change will be made.
  resolutionNote: >-
    To determine which functions a change to one group reaches, three recorded facts have to be
    combined - the group's activation condition, the constructorArgs at each construction site,
    and the members each function actually reads. Those three are recorded separately, below and
    in the function files. This index does not carry a precomputed consumer set for any group.

modules:

  - id: MOD-INTERVALTIMER
    path: src/health_monitor/common/interval_timer.py
    layer: LYR-REAL
    kind: shared module
    owningComponent: LC-PLATFORM
    usedByProcesses: [PRC-HEALTHMON]
    exports: [IntervalTimer, TimerTick, TimerConfigurationError, Clock, DEFAULT_CLOCK]
    importedBy:
      - path: src/health_monitor/checks/base.py
        symbols: [IntervalTimer, TimerTick]
      - path: src/health_monitor/checks/memory_integrity.py
        symbols: [IntervalTimer, TimerTick]
      - path: src/health_monitor/checks/storage_health.py
        symbols: [IntervalTimer, TimerTick]
      - path: src/health_monitor/checks/heartbeat.py
        symbols: [IntervalTimer, TimerTick]
    importGraphNote: >-
      Every check module imports this module, constructs at least one IntervalTimer in its own
      constructor, and has an instance polled once per control-loop iteration. An import graph, a
      call graph over poll, or a search for the module path therefore reaches all three functions
      identically and does not separate them.
    apiGroups:
      - id: BHV-TIMER-CADENCE
        name: Cadence
        members:
          - TimerTick.due
          - TimerTick.elapsed_since_service
          - TimerTick.overdue_by
          - TimerTick.missed_slots
          - IntervalTimer.mark_serviced
          - IntervalTimer.seconds_until_due
          - IntervalTimer.period_s
        activation: >-
          Active on every instance. Does not depend on any constructor argument beyond period_s,
          which is mandatory.
        constructorGate: none, beyond the mandatory period_s
        stateOwned:
          - _period_s, the configured cadence
          - _last_service, the anchor the next due instant is measured from
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
      - id: BHV-TIMER-EXPIRY
        name: Expiry
        members:
          - TimerTick.expiry_enabled
          - TimerTick.expired
          - TimerTick.time_since_refresh
          - IntervalTimer.refresh
          - IntervalTimer.expiry_enabled
          - IntervalTimer.expiry_s
        activation: >-
          Live only on an instance constructed with expiry_s supplied. With expiry_s left at None
          the members are still present and still returned on every poll, but inert -
          expiry_enabled is False, expired is always False and time_since_refresh is None. poll
          returns the same TimerTick type in both cases, so reachability of these members says
          nothing about whether they carry meaning for a given instance.
        constructorGate: IntervalTimer.__init__ parameter expiry_s, default None
        stateOwned:
          - _expiry_s, the configured window, or None when the group is inert on this instance
          - _last_refresh, the anchor the reported gap is measured from
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
      - id: BHV-TIMER-SHARED
        name: Shared clock and instance state
        members:
          - IntervalTimer.__init__
          - IntervalTimer.poll
          - IntervalTimer.reset
          - IntervalTimer.name
          - TimerTick.now
        activation: >-
          Active on every instance. poll takes one clock reading and returns both groups' members
          in a single immutable TimerTick, so the two groups share a clock read, a lock and a
          construction path.
        constructorGate: none
        stateOwned:
          - _clock, the injected monotonic clock source
          - _lock, guarding every read of instance state
          - _name, the diagnostic label
          - _created_at, the construction reading
          - the TimerTick dataclass returned by poll, which carries every group's members
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
        groupBoundaryNote: >-
          IntervalTimer.reset is listed here because it is callable on every instance, but it
          writes the anchors listed under stateOwned on both other groups. A change confined to
          reset has to be evaluated against all three groups, not this one alone.
        unGroupedExports:
          - TimerConfigurationError, raised by the constructor on a nonsensical period or expiry
    constructionSites:
      - site: src/health_monitor/checks/memory_integrity.py MemoryIntegrityCheck.__init__
        function: FN-HM-RAM
        instanceName: ram-sweep
        instanceCount: 1
        constructorArgs:
          period_s: config.scan_period_s
          expiry_s: not supplied
          clock: injected, defaults to time.monotonic
          start_due: true
        sourceComment: >-
          "Cadence only. The sweep is self-paced and has no external event to wait for, so no
          expiry window is configured on this timer."
      - site: src/health_monitor/checks/storage_health.py StorageHealthCheck.__init__
        function: FN-HM-DISK
        instanceName: disk-scan
        instanceCount: 1
        constructorArgs:
          period_s: config.scan_period_s
          expiry_s: not supplied
          clock: injected, defaults to time.monotonic
          start_due: true
        sourceComment: >-
          "Cadence only. Nothing external drives this check, so the timer is constructed without
          an expiry window; staleness of an individual mount is tracked per mount below, against
          its own last good probe."
      - site: src/health_monitor/checks/heartbeat.py HeartbeatCheck.__init__, emit timer
        function: FN-HM-HB
        instanceName: heartbeat-emit
        instanceCount: 1
        constructorArgs:
          period_s: config.emit_period_s
          expiry_s: not supplied
          clock: injected, defaults to time.monotonic
          start_due: true
        sourceComment: >-
          "Emission cadence. This timer schedules our own outgoing heartbeat and waits on nothing,
          so it carries no expiry window."
      - site: src/health_monitor/checks/heartbeat.py HeartbeatCheck.__init__, per peer timer
        function: FN-HM-HB
        instanceName: peer-<peer>
        instanceCount: one per entry in config.peers, four with the shipped configuration
        constructorArgs:
          period_s: config.emit_period_s
          expiry_s: config.peer_timeout_s
          clock: injected, defaults to time.monotonic
          start_due: not supplied
        sourceComment: >-
          "Observation. Each peer timer is constructed with an expiry window; an arriving
          heartbeat refreshes it and expiry declares the peer lost."
    memberReadSites:
      about: >-
        Where each function reads members returned by this module. Recorded per function and per
        instance; see the timerUsage block in each function file for the same facts in context.
      entries:
        - function: FN-HM-RAM
          instance: ram-sweep
          membersRead: [due, overdue_by, missed_slots, now]
          methodsCalled: [poll, mark_serviced]
        - function: FN-HM-DISK
          instance: disk-scan
          membersRead: [due, now]
          methodsCalled: [poll, mark_serviced]
        - function: FN-HM-HB
          instance: heartbeat-emit
          membersRead: [due, now]
          methodsCalled: [poll, mark_serviced]
        - function: FN-HM-HB
          instance: peer-<peer>
          membersRead: [expired, time_since_refresh, now]
          methodsCalled: [poll, refresh]

  - id: MOD-CHECKBASE
    path: src/health_monitor/checks/base.py
    layer: LYR-REAL
    kind: shared base class
    owningComponent: LC-HEALTH
    usedByProcesses: [PRC-HEALTHMON]
    exports: [PeriodicCheck]
    subclassedBy:
      - module: MOD-MEMINTEGRITY
        function: FN-HM-RAM
      - module: MOD-STORAGEHEALTH
        function: FN-HM-DISK
      - module: MOD-HEARTBEAT
        function: FN-HM-HB
    apiGroups:
      - id: BHV-CHECK-SERVICE
        name: Service step
        members: [PeriodicCheck.service, PeriodicCheck.timer, PeriodicCheck.stats, PeriodicCheck.attach]
        activation: Active for every subclass on every control-loop iteration.
        constructorGate: none
        stateOwned:
          - the IntervalTimer instance the check was constructed with
          - the CheckStats counters kept for the service status topic
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
      - id: BHV-CHECK-PUBLISH
        name: Result publication
        members: [PeriodicCheck._publish, PeriodicCheck.result]
        activation: Active whenever a subclass returns results from on_tick.
        constructorGate: none
        stateOwned:
          - the last published HealthState per subject, used to detect a transition
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
    tickHandling: >-
      service polls the check's own timer and passes the resulting TimerTick to on_tick whole and
      unmodified. The base class does not interpret the tick - it does not decide whether a check
      runs and it does not acknowledge the cadence slot. It reads TimerTick.missed_slots for the
      skipped-slot counter and TimerTick.now on the exception path only. Every subclass therefore
      presents an identical dependency on the timer at this layer.
    membersReadFromTimerTick: [missed_slots, now]

  - id: MOD-MEMINTEGRITY
    path: src/health_monitor/checks/memory_integrity.py
    layer: LYR-REAL
    kind: function primary module
    owningComponent: LC-HEALTH
    usedByProcesses: [PRC-HEALTHMON]
    exports: [MemoryIntegrityCheck, MemorySource, NullMemorySource, EccCounters, PAGE_BYTES]
    realizes: FN-HM-RAM
    exclusiveToOneFunction: true
    thresholdsAndWindows:
      - name: slice_budget_ms
        configuredValue: 1.5
        measuredOn: budget_clock, defaulting to time.perf_counter
        evaluatedIn: MemoryIntegrityCheck._advance_slice
        relationToIntervalTimer: >-
          None. The budget clock is a separate injected callable and is read directly in the slice
          loop; no IntervalTimer instance and no TimerTick member is involved.

  - id: MOD-STORAGEHEALTH
    path: src/health_monitor/checks/storage_health.py
    layer: LYR-REAL
    kind: function primary module
    owningComponent: LC-HEALTH
    usedByProcesses: [PRC-HEALTHMON]
    exports: [StorageHealthCheck, StorageProbe, FilesystemProbe, MountProbe]
    realizes: FN-HM-DISK
    exclusiveToOneFunction: true
    thresholdsAndWindows:
      - name: stall_threshold_s
        configuredValue: 120.0
        measuredOn: StorageHealthCheck._stale_for, over the per mount _last_good_probe map
        evaluatedIn: StorageHealthCheck._evaluate
        relationToIntervalTimer: >-
          None. _last_good_probe is written from TimerTick.now when a probe succeeds, so the
          timestamp originates in the tick, but the staleness value and the threshold comparison
          are computed inside this module. No expiry member of any TimerTick is read.
      - name: probe_latency_warn_ms and probe_latency_fault_ms
        configuredValue: 40.0 and 250.0
        measuredOn: FilesystemProbe latency_clock, defaulting to time.perf_counter
        evaluatedIn: StorageHealthCheck._evaluate
        relationToIntervalTimer: None.

  - id: MOD-HEARTBEAT
    path: src/health_monitor/checks/heartbeat.py
    layer: LYR-REAL
    kind: function primary module
    owningComponent: LC-HEALTH
    usedByProcesses: [PRC-HEALTHMON]
    exports: [HeartbeatCheck, PeerRecord, PEER_TOPIC_PREFIX, QUORUM_SUBJECT]
    realizes: FN-HM-HB
    exclusiveToOneFunction: true
    thresholdsAndWindows:
      - name: peer_timeout_s
        configuredValue: 3.0
        measuredOn: each peer's own IntervalTimer instance, passed as expiry_s at construction
        evaluatedIn: the timer module, reported back through TimerTick.expired
        relationToIntervalTimer: >-
          This threshold is handed to MOD-INTERVALTIMER rather than evaluated here. The module
          docstring records that there is no separate bookkeeping of peer arrival times in this
          module and that the expiry window carried by each peer timer is the sole definition of
          how long a peer may stay silent.
      - name: quorum_min_live
        configuredValue: 3
        measuredOn: the count of peer records whose live flag is set
        evaluatedIn: HeartbeatCheck._evaluate_quorum
        relationToIntervalTimer: >-
          Indirect. The live flag is assigned in _evaluate_peer from the peer tick.

  - id: MOD-BUS
    path: src/health_monitor/bus.py
    layer: LYR-REAL
    kind: shared transport
    owningComponent: LC-PLATFORM
    usedByProcesses: [PRC-HEALTHMON]
    exports: [MessageBus, Message, BusOverflow]
    apiGroups:
      - id: BHV-BUS-PUB
        name: Publication
        members: [MessageBus.publish]
        activation: Active for every caller. Non blocking; delivery happens on drain or on the dispatch thread.
        constructorGate: none
        stateOwned:
          - the delivery queue and its depth
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
      - id: BHV-BUS-SUB
        name: Subscription
        members: [MessageBus.subscribe, MessageBus.drain, MessageBus.start]
        activation: Active only for callers that register a handler.
        constructorGate: none
        stateOwned:
          - the subscription table mapping a topic pattern to a handler
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
    callSites:
      - function: FN-HM-RAM
        groups: [BHV-BUS-PUB]
        via: MOD-CHECKBASE PeriodicCheck._publish
      - function: FN-HM-DISK
        groups: [BHV-BUS-PUB]
        via: MOD-CHECKBASE PeriodicCheck._publish
      - function: FN-HM-HB
        groups: [BHV-BUS-PUB, BHV-BUS-SUB]
        via: >-
          Publication through PeriodicCheck._publish for results and directly through
          MessageBus.publish for the own heartbeat. Subscription directly through
          MessageBus.subscribe in HeartbeatCheck.attach.

  - id: MOD-TYPES
    path: src/health_monitor/common/types.py
    layer: LYR-REAL
    kind: shared value types
    owningComponent: LC-HEALTH
    usedByProcesses: [PRC-HEALTHMON]
    exports: [HealthState, CheckResult, CheckStats]
    apiGroups:
      - id: BHV-TYPES-RESULT
        name: Result value type
        members: [CheckResult, CheckResult.topic, CheckResult.as_payload, HealthState]
        activation: Active for every check.
        constructorGate: none
        stateOwned:
          - no instance state; the CheckResult and CheckStats dataclass shapes and the HealthState ladder
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
    usedByFunctions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]

  - id: MOD-CONFIG
    path: src/health_monitor/config.py
    layer: LYR-REAL
    kind: shared configuration
    owningComponent: LC-HEALTH
    usedByProcesses: [PRC-HEALTHMON]
    exports: [ServiceConfig, MemoryCheckConfig, StorageCheckConfig, HeartbeatCheckConfig, ConfigError, load, describe]
    apiGroups:
      - id: BHV-CFG-LOAD
        name: Configuration load and validation
        members: [load, describe, ConfigError]
        activation: Active once at service construction.
        constructorGate: none
        stateOwned:
          - the parsed per section configuration objects handed to each check at construction
        changeSurface:
          - the membership of this group - which members belong to it, their names and their types
          - the semantics of each member, including boundary and edge-case behaviour
          - the state listed under stateOwned, and what each value is measured or derived from
          - the activation condition recorded above, and how it is enforced
    sectionsByFunction:
      - function: FN-HM-RAM
        section: memory
        type: MemoryCheckConfig
      - function: FN-HM-DISK
        section: storage
        type: StorageCheckConfig
      - function: FN-HM-HB
        section: heartbeat
        type: HeartbeatCheckConfig
    configFile: config/health-monitor.json

  - id: MOD-SERVICE
    path: src/health_monitor/service.py
    layer: LYR-REAL
    kind: service entry point
    owningComponent: LC-HEALTH
    usedByProcesses: [PRC-HEALTHMON]
    exports: [HealthMonitorService, build_checks, STATUS_TOPIC]
    constructsFunctions:
      - function: FN-HM-RAM
        constructedIn: build_checks, when config.memory.enabled
      - function: FN-HM-DISK
        constructedIn: build_checks, when config.storage.enabled
      - function: FN-HM-HB
        constructedIn: build_checks, when config.heartbeat.enabled
    loopBehaviour: >-
      step drains the bus, then calls service on every check in construction order, then takes the
      worst state across the results. _sleep_budget takes the minimum of seconds_until_due across
      every check's timer, capped at loop_period_s, so the cadence of any one check influences how
      long the loop sleeps for all of them.
    publishes: [TOP-HEALTH-STATUS]

  - id: MOD-LOGSETUP
    path: src/health_monitor/logging_setup.py
    layer: LYR-REAL
    kind: service support
    owningComponent: LC-HEALTH
    usedByProcesses: [PRC-HEALTHMON]
    exports: [configure, log_fields]
    usedByFunctions: [FN-HM-RAM, FN-HM-DISK, FN-HM-HB]
    note: Log record formatting only. Carries no health decision.
