schema: architecture.function.v1
file: model/functions/FN-HM-DISK.yaml

function:
  id: FN-HM-DISK
  name: Storage health checking
  checkId: disk
  layer: LYR-FUNC
  owningProcess: PRC-HEALTHMON
  realizesComponent: LC-HEALTH
  satisfiesNeeds: [UN-03, UN-05]
  description: >-
    Probes every configured mount point on each cadence slot. A probe reads the free space fraction
    from the filesystem and then performs a small write and fsync round trip that is timed, so that
    a device still mounted but no longer servicing IO is detected. Two failure shapes are
    distinguished - a probe that returns a bad number, and a probe that does not return a usable
    observation at all.
  cadence:
    kind: periodic
    configuredPeriodSeconds: 30.0
    configKey: storage.scan_period_s
    startDue: true
  supervisedSubjects:
    source: storage.mounts
    values: ["/var/log", "/var/lib/cases"]
    subjectSlugRule: mount path stripped of leading and trailing slashes with remaining slashes replaced by hyphens
  inputs:
    - name: Mount list and thresholds
      kind: configuration
      origin: MOD-CONFIG StorageCheckConfig
      fields: [mounts, scan_period_s, free_warn_fraction, free_fault_fraction, probe_write_bytes, probe_latency_warn_ms, probe_latency_fault_ms, stall_threshold_s]
    - name: Filesystem usage
      kind: platform read
      origin: StorageProbe.probe, default FilesystemProbe using shutil.disk_usage
    - name: Write and fsync round trip
      kind: platform write
      origin: StorageProbe.probe, default FilesystemProbe using tempfile.mkstemp plus os.fsync
      note: Latency measured on the probe's own latency_clock, defaulting to time.perf_counter.
    - name: Timer tick
      kind: event
      origin: MOD-INTERVALTIMER via MOD-CHECKBASE
      note: >-
        One TimerTick per control-loop iteration, produced by this function's own IntervalTimer
        instance and passed through PeriodicCheck.service without interpretation.
  outputs:
    - name: Storage health result per mount
      kind: published result
      topic: TOP-HEALTH-DISK
      states: [OK, DEGRADED, FAULT]
      subject: the mount slug
      emittedWhen: every cadence slot, one result per configured mount
      metrics: [free_fraction, total_bytes, write_latency_ms, consecutive_failures, stale_for_s]
  timerUsage:
    instances:
      - name: disk-scan
        constructedIn: src/health_monitor/checks/storage_health.py StorageHealthCheck.__init__
        constructorArgs:
          period_s: config.scan_period_s
          expiry_s: not supplied
          clock: injected, defaults to time.monotonic
          start_due: true
        count: 1
    tickMembersRead: [due, now]
    membersAlsoReadByTheBaseClass:
      members: [missed_slots, now]
      readIn: MOD-CHECKBASE PeriodicCheck.service
      note: >-
        Read for every subclass, on the instance named above. tickMembersRead on this function
        records what this function's own code reads, not what the base class reads on its behalf.
    timerMethodsCalled: [poll, mark_serviced]
    cadenceSlotAcknowledgedBy: this function, by calling mark_serviced after probing every mount
  otherClocksAndWindows:
    - name: per mount staleness
      source: >-
        StorageHealthCheck._stale_for, computed as now minus the mount's entry in
        _last_good_probe. The entry is written from tick.now whenever a probe for that mount
        returns ok.
      usedFor: >-
        Deciding whether a failing mount is FAULT or DEGRADED, by comparing the staleness against
        stall_threshold_s alongside the consecutive failure count. Held per mount inside this
        function. Not read from any timer instance and not produced by the timer module.
      configKey: storage.stall_threshold_s
      configuredValueSeconds: 120.0
      surfaceNote: >-
        stall_threshold_s is a seconds-valued timeout expressed on this function's own bookkeeping,
        not on a timer instance.
    - name: write probe latency clock
      source: FilesystemProbe latency_clock, defaults to time.perf_counter
      usedFor: Measuring the write and fsync round trip against probe_latency_warn_ms and probe_latency_fault_ms.
  realizedBy:
    - module: MOD-STORAGEHEALTH
      path: src/health_monitor/checks/storage_health.py
      role: primary
      exclusiveToThisFunction: true
    - module: MOD-CHECKBASE
      path: src/health_monitor/checks/base.py
      role: shared base class
    - module: MOD-INTERVALTIMER
      path: src/health_monitor/common/interval_timer.py
      role: shared module
    - module: MOD-TYPES
      path: src/health_monitor/common/types.py
      role: shared value types
    - module: MOD-BUS
      path: src/health_monitor/bus.py
      role: shared transport
    - module: MOD-CONFIG
      path: src/health_monitor/config.py
      role: shared configuration
  allocations:
    requirements: [RQ-HM-04, RQ-HM-05, RQ-HM-06]
    risks: [RSK-HM-03]
    riskControlRequirements: [RC-HM-02]
    verifications: [TC-HM-04, TC-HM-05, TC-HM-06]
    reverseIndex: model/allocation/control-to-function.yaml
  interactionCells:
    asRow: [N2-DISK-RAM, N2-DISK-HB]
    asColumn: [N2-RAM-DISK, N2-HB-DISK]
